title: Artifact
description: >
  A small studio building tools for thinking, making, and navigating the world.
  These are the projects.
author: Artifact
accent_color: "#1a1a1a"
url: https://catalogue-artifact.pages.dev

# Where things live. Defaults (/, /, /p/) reproduce the template's original
# layout: catalogue index at the site root, entries at /p/<slug>/.
#
# Artifact mounts the catalogue at /catalog/ — deliberately the US spelling,
# even though the repo and title say "catalogue". Don't "fix" it.
home_path: /
catalog_path: /catalog/
entry_path: /catalog/

# Flat list of {label, path}. Empty means no nav is rendered at all, which is
# how a page stays unlisted — never auto-add pages here.
nav: []

stack: cloudflare
cloudflare:
  pages_project: catalogue-artifact
  r2_bucket: catalogue-artifact
  # Custom domain, not the pub-*.r2.dev URL: Cloudflare rate-limits r2.dev and
  # does not support it for production traffic.
  r2_media_base_url: https://media.artifact.com

# Index groups, in this order. Every entry needs one (plan 02).
categories:
  - { id: product, label: Products }
  - { id: system, label: Systems }
  - { id: tool, label: Tools }
  - { id: infrastructure, label: Infrastructure }

# Product repos that carry their entry in .artifact/ (the template's default
# source_dir). `npm run import` copies them into projects/ and media/.
sources: []

# The two Pebble app stores, beyond the template's built-in link kinds.
link_kinds:
  pebble: { label: Pebble (Rebble), hosts: [apps.rebble.io] }
  repebble: { label: Pebble (RePebble), hosts: [apps.repebble.com] }
